<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>

         <fieldset>

            <legend>SCHOOL REGISTRATION FORM</legend>

            <br>
            
            <label for="1st">First Name: </label>
            <input type="text" name="First Name" id="1st" placeholder="Enter First Name">

            <br>
            <br>

            <label for="2nd">Last Name: </label>
            <input type="text" name="Last Name" id="2nd" placeholder="Enter Last Name">

            <br>
            <br>

            <label for="3rd">Date Of Birth: </label>
            <input type="date" name="DOB" id="3rd">

            <br>
            <br>

            <label for="4th">Parent's Email: </label>
            <input type="text" name="Email" id="4th" placeholder="parent@example.com">

            <br>
            <br>

            <label for="5th">Previous School Name: </label>
            <input type="text" name="Previous Schl Name" id="5th" placeholder="Enter Previous School Name">

            <br>
            <br>

            <label for="6th">Grade applying for: </label>
            <select name="Grade" id="6th" placeholder="Select">
                <option value="1st">1st Grade</option>
                <option value="2nd">2nd Grade</option>
                <option value="3rd">3rd Grade</option>
                <option value="4th">4th Grade</option>
                <option value="5th">5th Grade</option>
                <option value="6th">6th Grade</option>
                <option value="7th">7th Grade</option>
                <option value="8th">8th Grade</option>
                <option value="9th">9th Grade</option>
                <option value="10th">10th Grade</option>
                <option value="11th">11th Grade</option>
                <option value="12th">12th Grade</option>
            </select>   

            <br>
            <br>

            <label for="7th">Special Requirements: </label>
            <textarea name="Special Requirements" id="7th" rows="10" cols="80" placeholder="Please list any Special academic or dietary needs"></textarea>

            <br>
            <br>

            <label for="8th">Upload Previous Report Card: </label>
            <input type="file" name="Report Card" id="8th" placeholder="Choose File or Drop Here">

            <br>
            <br>

            <input type="checkbox" name="Consent" id="9th">
            <label for="9th">I consent to the processing of my child's personal data accoording to the privacy policy.</label>

            <br>
            <br>

            <label for="10th"></label>
            <input type="submit" name="Submit Registration" id="10th" value="Submit Registration">

         </fieldset>

    </form>

</body>
</html>
