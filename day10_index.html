<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>

         <fieldset>

            <legend>SCHOOL REGISTRATION FORM</legend>

            <br>
            
            <label for="1st">First Name: </label>
            <input type="text" name="First Name" id="1st" placeholder="Enter First Name">

            <br>
            <br>

            <label for="2nd">Last Name: </label>
            <input type="text" name="Last Name" id="2nd" placeholder="Enter Last Name">

            <br>
            <br>

            <label for="3rd">Date Of Birth: </label>
            <input type="date" name="DOB" id="3rd">

            <br>
            <br>

            <label for="4th">Parent's Email: </label>
            <input type="text" name="Email" id="4th" placeholder="parent@example.com">

            <br>
            <br>

            <label for="5th">Previous School Name: </label>
            <input type="text" name="Previous Schl Name" id="5th" placeholder="Enter Previous School Name">

            <br>
            <br>

            <label for="6th">Grade applying for: </label>
            <select name="Grade" id="6th" placeholder="Select">
                <option value="1st">1st Grade</option>
                <option value="2nd">2nd Grade</option>
                <option value="3rd">3rd Grade</option>
                <option value="4th">4th Grade</option>
                <option value="5th">5th Grade</option>
                <option value="6th">6th Grade</option>
                <option value="7th">7th Grade</option>
                <option value="8th">8th Grade</option>
                <option value="9th">9th Grade</option>
                <option value="10th">10th Grade</option>
                <option value="11th">11th Grade</option>
                <option value="12th">12th Grade</option>
            </select>   

            <br>
            <br>

            <label for="7th">Special Requirements: </label>
            <textarea name="Special Requirements" id="7th" rows="10" cols="80" placeholder="Please list any Special academic or dietary needs"></textarea>

            <br>
            <br>

            <label for="8th">Upload Previous Report Card: </label>
            <input type="file" name="Report Card" id="8th" placeholder="Choose File or Drop Here">

            <br>
            <br>

            <input type="checkbox" name="Consent" id="9th">
            <label for="9th">I consent to the processing of my child's personal data accoording to the privacy policy.</label>

            <br>
            <br>

            <label for="10th"></label>
            <input type="submit" name="Submit Registration" id="10th" value="Submit Registration">

         </fieldset>

    </form>

    <br>
    <br>

    <form>
        
        <fieldset>

            <legend>CUSTOMER SATISFACTION SURVEY</legend>

            <label for="1st">Full Name</label>
            <input type="text" name="Name" id="1st" placeholder="Enter your name">

            <br>
            <br>

            <label for="2nd">Email Address</label>
            <input type="text" name="Email" id="2nd" placeholder="Enter your email address">

            <br>
            <br>

            <label for="3rd">Phone Number</label>
            <input type="text" name="Phone" id="3rd" placeholder="Enter your phone number">

            <br>
            <br>

            <label for="4th">Date of Purchase/Interaction</label>
            <input type="text" name="Date of Purchase" id="4th" placeholder="Enter the date of purchase or interaction">

            <br>
            <br>

            
            <label for="5th">Product/Service Quality</label>
            
            <br>

            <input type="radio" name="Poor" id="6th">
            <label for="6th">Poor</label>

            <br>
            
            <input type="radio" name="Fair" id="7th">
            <label for="7th">Fair</label>

            <br>

            <input type="radio" name="Good" id="8th">
            <label for="8th">Good</label>

            <br>

            <input type="radio" name="Very Good" id="9th">
            <label for="9th">Very Good</label>

            <br>

            <input type="radio" name="Excellent" id="10th">
            <label for="10th">Excellent</label>

            <br>
            <br>

             <label for="11th">Ease of Use/Interaction</label>
            
            <br>

            <input type="radio" name="Poor" id="12th">
            <label for="12th">Poor</label>

            <br>
            
            <input type="radio" name="Fair" id="13th">
            <label for="13th">Fair</label>

            <br>

            <input type="radio" name="Good" id="14th">
            <label for="14th">Good</label>

            <br>

            <input type="radio" name="Very Good" id="15th">
            <label for="15th">Very Good</label>

            <br>

            <input type="radio" name="Excellent" id="16th">
            <label for="16th">Excellent</label>

            <br>
            <br>

            <label for="17th">Customer Service Experience</label>
            
            <br>

            <input type="radio" name="Poor" id="17th">
            <label for="17th">Poor</label>

            <br>
            
            <input type="radio" name="Fair" id="18th">
            <label for="18th">Fair</label>

            <br>

            <input type="radio" name="Good" id="19th">
            <label for="19th">Good</label>

            <br>

            <input type="radio" name="Very Good" id="20th">
            <label for="20th">Very Good</label>

            <br>

            <input type="radio" name="Excellent" id="21st">
            <label for="21st">Excellent</label>

            <br>
            <br>

            <label for="22nd">Overall Interaction(1-5)</label>

            <br>

            <input type="range" name="Satisfaction" id="22nd" min="0" max="5" step="1" value="5">

            <br>
            <br>

            <label for="23rd">Likelihood to Recommend (0-10)</label>

            <br>

            <input type="range" name="Recommendation" id="23rd">

            <br>
            <br>

            <label for="24th">What Did You Like Most?</label>
            <textarea name="Like the most" id="24th" placeholder="Tell us what stood out to you" cols="50"></textarea>

            <br>
            <br>

            <label for="25th">What Can We Improve?</label>
            <textarea name="Improve" id="25th" placeholder="Tell us how we can improve" cols="50"></textarea>

            <br>
            <br>

            <label for="26th">Additional Comments or Suggestions</label>
            <textarea name="Suggestions" id="26th" placeholder="Share anything else you'd like us to know" cols="50"></textarea>

            <br>
            <br>

            <input type="checkbox" name="Contact" id="27th">
            <label for="27th">May We Contact You for Follow-Up?</label>

            <br>
            <br>

            <label for="28th"></label>
            <input type="submit" name="Submit" id="28th" value="Submit Response">

        </fieldset>


    </form>


</body>
</html>
